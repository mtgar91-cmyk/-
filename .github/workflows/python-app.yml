# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run Telegram Bot

on:
  workflow_dispatch: # لتشغيل البوت يدوياً من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot telethon
          # إذا كان لديك ملف متطلبات خاص، استخدم: pip install -r requirements.txt

      - name: Run Bot
        run: python app.py
        env:
          # يفضل وضع التوكن في Secrets وليس في الكود مباشرة
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
